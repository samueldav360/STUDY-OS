<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Study OS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            color: #9ca3af;
            margin-bottom: 0.35rem;
        }
        form input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            color: white;
            outline: none;
            transition: all 0.2s;
        }
        form input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f1;
        }
    </style>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center h-screen selection:bg-indigo-500 selection:text-white">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-sm mx-4">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-white">Study OS</h1>
            <p class="text-gray-400 text-sm mt-2">Bienvenido a tu zona de enfoque</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors duration-200 text-white font-semibold py-2.5 px-4 rounded-lg mt-4 shadow-md">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-gray-800 text-center">
            <p class="text-sm text-gray-400">
                ¿No tienes cuenta? 
                <a href="{% url 'register' %}" class="text-indigo-400 hover:text-indigo-300 hover:underline transition-colors">Regístrate aquí</a>
            </p>
        </div>

    </div>
</body>
</html>
